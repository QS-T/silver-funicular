<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师课时考勤管理系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>📚 教师考勤系统</h1>
                <p>课时考勤管理 · 教师课时考勤管理系统</p>
            </div>
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">账号</label>
                    <input type="text" id="username" placeholder="请输入账号" value="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" value="123456" required>
                </div>
                <button type="submit" class="btn-login">登 录</button>
                <div class="error-msg" id="loginError"></div>
            </form>
            <div style="margin-top: 20px; font-size: 13px; color: #8a9bb0; text-align: center; border-top: 1px solid #edf2f7; padding-top: 16px;">
                <p>测试账号：admin / 123456 &nbsp;|&nbsp; jiaowu1 / jiaowu@123 &nbsp;|&nbsp; leader1 / leader@666</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
